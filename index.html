<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои фильмы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14110f;
    --surface: #1e1a16;
    --border: #332b23;
    --gold: #d9a441;
    --gold-dim: #8a6a30;
    --red: #8a3a35;
    --red-dim: #4d2521;
    --text: #f3ede3;
    --muted: #9c9186;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 700px;
    margin: 0 auto;
    padding: 48px 20px 100px;
  }

  header {
    margin-bottom: 40px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.4rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }

  /* toolbar */
  .toolbar {
    display: flex;
    gap: 10px;
    margin: 32px 0 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar input[type="text"] {
    flex: 1;
    min-width: 160px;
  }

  select, input[type="text"], input[type="number"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 9px 12px;
    border-radius: var(--radius);
  }

  select:focus, input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border-radius: var(--radius);
  }

  .btn-add {
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #1a1510;
    font-weight: 600;
    padding: 9px 18px;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .btn-add:hover { background: #e8b656; }

  /* movie list */
  .empty {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { color: var(--text); display:block; margin-bottom: 6px; font-family:'Fraunces', serif; font-size: 1.1rem; font-weight: 500;}

  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px 16px 30px;
    overflow: hidden;
  }

  /* sprocket holes on the left edge, a nod to film stock */
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 14px;
    background-image: radial-gradient(circle at 7px 12px, var(--bg) 3px, transparent 3.5px);
    background-size: 14px 24px;
    background-repeat: repeat-y;
    border-right: 1px solid var(--border);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .card-title-block { min-width: 0; }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    font-weight: 500;
    margin: 0;
    word-break: break-word;
  }
  .card-year { color: var(--muted); font-size: 0.85rem; }

  .score {
    display: flex;
    align-items: baseline;
    gap: 3px;
    flex-shrink: 0;
  }
  .score .num {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
  }
  .score .max { color: var(--muted); font-size: 0.85rem; }

  .criteria {
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .crit-row {
    display: grid;
    grid-template-columns: 110px 1fr 28px;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .crit-bar {
    height: 5px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
  }
  .crit-bar > span {
    display: block;
    height: 100%;
    background: var(--gold-dim);
  }
  .crit-val { text-align: right; color: var(--text); }

  .card-note {
    margin-top: 12px;
    font-size: 0.88rem;
    color: var(--muted);
    white-space: pre-wrap;
  }

  .card-actions {
    display: flex;
    gap: 14px;
    margin-top: 12px;
  }
  .card-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 2px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .card-actions button:hover { color: var(--text); }
  .card-actions .del:hover { color: var(--red); }

  /* modal / form */
  dialog {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 480px;
    width: 92vw;
    padding: 0;
  }
  dialog::backdrop { background: rgba(10, 8, 6, 0.7); }

  .dlg-inner { padding: 24px; }

  .dlg-inner h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.4rem;
    margin: 0 0 20px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input[type="text"], .field input[type="number"], .field textarea {
    width: 100%;
  }
  .field textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 9px 12px;
    border-radius: var(--radius);
    resize: vertical;
    min-height: 60px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slider-row input[type="range"] {
    flex: 1;
    accent-color: var(--gold);
  }
  .slider-row .val {
    width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
  }

  .field.overall .slider-row .val {
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    color: var(--gold);
    width: 40px;
  }

  .dlg-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
  }
  .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 9px 16px;
    font-size: 0.9rem;
  }
  .btn-cancel:hover { color: var(--text); border-color: var(--muted); }
  .btn-save {
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #1a1510;
    font-weight: 600;
    padding: 9px 18px;
    font-size: 0.9rem;
  }
  .btn-save:hover { background: #e8b656; }

  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--border);
    font-size: 0.75rem;
  }

  @media (max-width: 480px) {
    .crit-row { grid-template-columns: 90px 1fr 26px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Мои фильмы</h1>
    <p class="sub">Личный список оценок — хранится только в этом браузере.</p>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Поиск по названию…">
    <select id="sort">
      <option value="date_desc">Сначала новые</option>
      <option value="score_desc">Сначала высокая оценка</option>
      <option value="score_asc">Сначала низкая оценка</option>
      <option value="title_asc">По названию А–Я</option>
    </select>
    <button class="btn-add" id="openAdd">+ Добавить фильм</button>
  </div>

  <div id="listArea"></div>

  <footer>данные хранятся локально в этом браузере (localStorage)</footer>
</div>

<dialog id="dlg">
  <div class="dlg-inner">
    <h2 id="dlgTitle">Новый фильм</h2>
    <form id="form" method="dialog">
      <input type="hidden" id="movieId">

      <div class="field">
        <label for="title">Название</label>
        <input type="text" id="title" required maxlength="120">
      </div>

      <div class="field">
        <label for="year">Год (необязательно)</label>
        <input type="number" id="year" min="1888" max="2100" placeholder="напр. 1994">
      </div>

      <div class="field overall">
        <label for="overall">Общая оценка</label>
        <div class="slider-row">
          <input type="range" id="overall" min="1" max="5" step="0.5" value="3">
          <span class="val" id="overallVal">3</span>
        </div>
      </div>

      <div class="field">
        <label>Сюжет</label>
        <div class="slider-row">
          <input type="range" class="crit-input" data-key="plot" min="1" max="5" step="0.5" value="3">
          <span class="val">3</span>
        </div>
      </div>

      <div class="field">
        <label>Актёрская игра</label>
        <div class="slider-row">
          <input type="range" class="crit-input" data-key="acting" min="1" max="5" step="0.5" value="3">
          <span class="val">3</span>
        </div>
      </div>

      <div class="field">
        <label>Визуал / графика</label>
        <div class="slider-row">
          <input type="range" class="crit-input" data-key="visuals" min="1" max="5" step="0.5" value="3">
          <span class="val">3</span>
        </div>
      </div>

      <div class="field">
        <label>Атмосфера / музыка</label>
        <div class="slider-row">
          <input type="range" class="crit-input" data-key="atmosphere" min="1" max="5" step="0.5" value="3">
          <span class="val">3</span>
        </div>
      </div>

      <div class="field">
        <label for="note">Заметка (необязательно)</label>
        <textarea id="note" maxlength="500" placeholder="Пара слов о впечатлении…"></textarea>
      </div>

      <div class="dlg-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn-save">Сохранить</button>
      </div>
    </form>
  </div>
</dialog>

<script>
(function(){
  const STORAGE_KEY = 'movie-rater:movies';
  const CRITERIA = [
    { key: 'plot', label: 'Сюжет' },
    { key: 'acting', label: 'Актёрская игра' },
    { key: 'visuals', label: 'Визуал' },
    { key: 'atmosphere', label: 'Атмосфера / музыка' }
  ];

  const listArea = document.getElementById('listArea');
  const dlg = document.getElementById('dlg');
  const form = document.getElementById('form');
  const dlgTitle = document.getElementById('dlgTitle');
  const searchInput = document.getElementById('search');
  const sortSelect = document.getElementById('sort');

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Не удалось прочитать сохранённые данные', e);
      return [];
    }
  }

  function save(movies) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
  }

  let movies = load();

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function render() {
    const query = searchInput.value.trim().toLowerCase();
    const sortMode = sortSelect.value;

    let items = movies.filter(m => m.title.toLowerCase().includes(query));

    items.sort((a, b) => {
      if (sortMode === 'score_desc') return b.overall - a.overall;
      if (sortMode === 'score_asc') return a.overall - b.overall;
      if (sortMode === 'title_asc') return a.title.localeCompare(b.title, 'ru');
      return b.createdAt - a.createdAt; // date_desc default
    });

    if (items.length === 0) {
      listArea.innerHTML = movies.length === 0
        ? `<div class="empty"><strong>Список пуст</strong>Добавьте первый фильм, который посмотрели.</div>`
        : `<div class="empty">Ничего не найдено по запросу «${escapeHtml(searchInput.value)}»</div>`;
      return;
    }

    listArea.innerHTML = `<div class="list">${items.map(cardHtml).join('')}</div>`;

    listArea.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => openEdit(btn.getAttribute('data-edit')));
    });
    listArea.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => removeMovie(btn.getAttribute('data-del')));
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function cardHtml(m) {
    const critRows = CRITERIA.map(c => {
      const v = m.criteria && m.criteria[c.key] != null ? m.criteria[c.key] : 0;
      const pct = (v / 5) * 100;
      return `<div class="crit-row">
        <span>${c.label}</span>
        <span class="crit-bar"><span style="width:${pct}%"></span></span>
        <span class="crit-val">${v}</span>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="card-top">
        <div class="card-title-block">
          <p class="card-title">${escapeHtml(m.title)}</p>
          ${m.year ? `<span class="card-year">${m.year}</span>` : ''}
        </div>
        <div class="score"><span class="num">${m.overall}</span><span class="max">/5</span></div>
      </div>
      <div class="criteria">${critRows}</div>
      ${m.note ? `<div class="card-note">${escapeHtml(m.note)}</div>` : ''}
      <div class="card-actions">
        <button data-edit="${m.id}">Изменить</button>
        <button class="del" data-del="${m.id}">Удалить</button>
      </div>
    </div>`;
  }

  function removeMovie(id) {
    const m = movies.find(x => x.id === id);
    if (!m) return;
    if (!confirm(`Удалить «${m.title}» из списка?`)) return;
    movies = movies.filter(x => x.id !== id);
    save(movies);
    render();
  }

  // --- dialog / form ---

  const overallInput = document.getElementById('overall');
  const overallVal = document.getElementById('overallVal');
  overallInput.addEventListener('input', () => overallVal.textContent = overallInput.value);

  document.querySelectorAll('.crit-input').forEach(inp => {
    const valSpan = inp.parentElement.querySelector('.val');
    inp.addEventListener('input', () => valSpan.textContent = inp.value);
  });

  document.getElementById('openAdd').addEventListener('click', () => openAdd());
  document.getElementById('cancelBtn').addEventListener('click', () => dlg.close());

  function resetForm() {
    form.reset();
    document.getElementById('movieId').value = '';
    overallInput.value = 3;
    overallVal.textContent = '3';
    document.querySelectorAll('.crit-input').forEach(inp => {
      inp.value = 3;
      inp.parentElement.querySelector('.val').textContent = '3';
    });
  }

  function openAdd() {
    resetForm();
    dlgTitle.textContent = 'Новый фильм';
    dlg.showModal();
    document.getElementById('title').focus();
  }

  function openEdit(id) {
    const m = movies.find(x => x.id === id);
    if (!m) return;
    resetForm();
    dlgTitle.textContent = 'Изменить фильм';
    document.getElementById('movieId').value = m.id;
    document.getElementById('title').value = m.title;
    document.getElementById('year').value = m.year || '';
    document.getElementById('note').value = m.note || '';
    overallInput.value = m.overall;
    overallVal.textContent = m.overall;
    document.querySelectorAll('.crit-input').forEach(inp => {
      const key = inp.getAttribute('data-key');
      const v = m.criteria && m.criteria[key] != null ? m.criteria[key] : 3;
      inp.value = v;
      inp.parentElement.querySelector('.val').textContent = v;
    });
    dlg.showModal();
    document.getElementById('title').focus();
  }

  form.addEventListener('submit', (e) => {
    const title = document.getElementById('title').value.trim();
    if (!title) { e.preventDefault(); return; }

    const id = document.getElementById('movieId').value;
    const criteria = {};
    document.querySelectorAll('.crit-input').forEach(inp => {
      criteria[inp.getAttribute('data-key')] = parseFloat(inp.value);
    });

    const data = {
      title,
      year: document.getElementById('year').value ? parseInt(document.getElementById('year').value, 10) : null,
      overall: parseFloat(overallInput.value),
      criteria,
      note: document.getElementById('note').value.trim()
    };

    if (id) {
      const idx = movies.findIndex(x => x.id === id);
      if (idx !== -1) movies[idx] = { ...movies[idx], ...data };
    } else {
      movies.push({ id: uid(), createdAt: Date.now(), ...data });
    }

    save(movies);
    render();
  });

  searchInput.addEventListener('input', render);
  sortSelect.addEventListener('change', render);

  render();
})();
</script>

</body>
</html>
